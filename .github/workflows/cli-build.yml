name: cli-build

on:
  push:
    branches:
      - feature/entrox-whitelabel-login-todo
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENCODE_CHANNEL: ci
  OPENCODE_VERSION: 0.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}

jobs:
  build:
    name: build (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux-x64
            host: ubuntu-24.04
          - name: macos-arm64
            host: macos-26
          - name: windows-x64
            host: windows-2025-vs2026
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          save-cache: "false"

      - name: Build native CLI
        working-directory: packages/opencode
        run: bun run build --single --skip-install --skip-embed-web-ui

      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: entrox-cli-${{ matrix.settings.name }}
          if-no-files-found: error
          retention-days: 7
          path: packages/opencode/dist/entrox-*

  release:
    name: publish dev release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup git committer
        id: committer
        continue-on-error: true
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.OPENCODE_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Download CLI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-input

      - name: Package release assets
        run: |
          mkdir -p release-assets
          python3 - <<'PY'
          import pathlib
          import shutil

          root = pathlib.Path("release-input")
          output = pathlib.Path("release-assets")
          for artifact in sorted(root.iterdir()):
              if artifact.is_dir():
                  children = [child for child in artifact.iterdir()]
                  source = children[0] if len(children) == 1 and children[0].is_dir() else artifact
                  shutil.make_archive(str(output / artifact.name), "zip", source)
          PY
          ls -lh release-assets

      - name: Publish dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: entrox-dev
        run: |
          cat > release-notes.md <<'EOF'
          Automated Entrox dev build from `${GITHUB_SHA}`.
          Version: `${OPENCODE_VERSION}`.

          ## Install

          ### macOS

          ```bash
          brew tap hexonal/entrox
          (brew trust hexonal/entrox || true)
          HOMEBREW_NO_AUTO_UPDATE=1 brew install hexonal/entrox/entrox
          ```

          For this dev build, download `entrox-cli-macos-arm64.zip`, unzip it, and move `bin/entrox` into a directory on your `PATH`.

          ### Linux

          Download `entrox-cli-linux-x64.zip`, unzip it, and move `bin/entrox` into a directory on your `PATH`.

          ```bash
          unzip entrox-cli-linux-x64.zip
          chmod +x bin/entrox
          sudo mv bin/entrox /usr/local/bin/entrox
          entrox --version
          ```

          ### Windows

          ```powershell
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          scoop bucket add entrox https://github.com/hexonal/scoop-entrox
          scoop install entrox
          ```

          For this dev build, download `entrox-cli-windows-x64.zip`, unzip it, and add the extracted `bin` directory to `PATH`.
          EOF
          sed -i "s/\${GITHUB_SHA}/${GITHUB_SHA}/g" release-notes.md
          sed -i "s/\${OPENCODE_VERSION}/${OPENCODE_VERSION}/g" release-notes.md
          gh release delete "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$TAG_NAME" release-assets/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "Entrox Dev Build" \
            --notes-file release-notes.md

      - name: Update Homebrew dev formula
        if: steps.committer.conclusion == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          HOMEBREW_TAP_REPO: hexonal/homebrew-entrox
          TAG_NAME: entrox-dev
        run: |
          set -euo pipefail
          macos_arm64_asset="entrox-cli-macos-arm64.zip"
          linux_x64_asset="entrox-cli-linux-x64.zip"
          macos_arm64_hash="$(sha256sum "release-assets/${macos_arm64_asset}" | cut -d' ' -f1)"
          linux_x64_hash="$(sha256sum "release-assets/${linux_x64_asset}" | cut -d' ' -f1)"
          export MACOS_ARM64_HASH="$macos_arm64_hash"
          export LINUX_X64_HASH="$linux_x64_hash"
          rm -rf homebrew-tap
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" homebrew-tap
          mkdir -p homebrew-tap/Formula
          python3 - <<'PY'
          import os
          import pathlib
          import textwrap

          formula = f"""\
          # typed: false
          # frozen_string_literal: true

          class Entrox < Formula
            desc "Entrox CLI"
            homepage "https://entrox.996icu.wiki"
            version "{os.environ['OPENCODE_VERSION']}"
            license "MIT"

            on_macos do
              depends_on arch: :arm64

              url "https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG_NAME']}/entrox-cli-macos-arm64.zip"
              sha256 "{os.environ['MACOS_ARM64_HASH']}"
            end

            on_linux do
              depends_on arch: :x86_64

              url "https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG_NAME']}/entrox-cli-linux-x64.zip"
              sha256 "{os.environ['LINUX_X64_HASH']}"
            end

            depends_on "ripgrep"

            def install
              bin.install "bin/entrox"
            end

            test do
              system "#{{bin}}/entrox", "--version"
            end
          end
          """
          pathlib.Path("homebrew-tap/Formula/entrox.rb").write_text(textwrap.dedent(formula))
          PY
          cd homebrew-tap
          git add Formula/entrox.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update Entrox dev Homebrew formula"
            git push origin HEAD:main
          fi

      - name: Update Scoop dev manifest
        if: steps.committer.conclusion == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          SCOOP_BUCKET_REPO: hexonal/scoop-entrox
          TAG_NAME: entrox-dev
        run: |
          set -euo pipefail
          win_asset="entrox-cli-windows-x64.zip"
          win_hash="$(sha256sum "release-assets/${win_asset}" | cut -d' ' -f1)"
          export WIN_HASH="$win_hash"
          rm -rf scoop-bucket
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${SCOOP_BUCKET_REPO}.git" scoop-bucket
          mkdir -p scoop-bucket/bucket
          python3 - <<'PY'
          import json
          import os
          import pathlib

          manifest = {
              "version": os.environ["OPENCODE_VERSION"],
              "description": "Entrox CLI",
              "homepage": "https://entrox.996icu.wiki",
              "license": "MIT",
              "architecture": {
                  "64bit": {
                      "url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG_NAME']}/entrox-cli-windows-x64.zip",
                      "hash": os.environ["WIN_HASH"],
                  }
              },
              "bin": r"bin\entrox.exe",
          }
          path = pathlib.Path("scoop-bucket/bucket/entrox.json")
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          cd scoop-bucket
          git add bucket/entrox.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Entrox dev Scoop manifest"
            git push origin HEAD:main
          fi
