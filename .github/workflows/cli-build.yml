name: cli-build

on:
  push:
    branches:
      - feature/entrox-whitelabel-login-todo
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPENCODE_CHANNEL: ci
  OPENCODE_VERSION: 0.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}

jobs:
  build:
    name: build (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux-x64
            host: blacksmith-4vcpu-ubuntu-2404
          - name: macos-arm64
            host: macos-26
          - name: windows-x64
            host: blacksmith-4vcpu-windows-2025
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build native CLI
        working-directory: packages/opencode
        run: bun run build --single --skip-install --skip-embed-web-ui

      - name: Upload CLI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: entrox-cli-${{ matrix.settings.name }}
          if-no-files-found: error
          retention-days: 7
          path: packages/opencode/dist/entrox-*
