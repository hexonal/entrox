name: cli-build

on:
  push:
    branches:
      - feature/entrox-whitelabel-login-todo
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENCODE_CHANNEL: ci
  OPENCODE_VERSION: 0.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}

jobs:
  build:
    name: build (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux-x64
            host: ubuntu-24.04
          - name: macos-arm64
            host: macos-26
          - name: windows-x64
            host: windows-2025
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          save-cache: "false"

      - name: Build native CLI
        working-directory: packages/opencode
        run: bun run build --single --skip-install --skip-embed-web-ui

      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: entrox-cli-${{ matrix.settings.name }}
          if-no-files-found: error
          retention-days: 7
          path: packages/opencode/dist/entrox-*

  release:
    name: publish dev release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-input

      - name: Package release assets
        run: |
          mkdir -p release-assets
          python3 - <<'PY'
          import pathlib
          import shutil

          root = pathlib.Path("release-input")
          output = pathlib.Path("release-assets")
          for artifact in sorted(root.iterdir()):
              if artifact.is_dir():
                  shutil.make_archive(str(output / artifact.name), "zip", artifact)
          PY
          ls -lh release-assets

      - name: Publish dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: entrox-dev
        run: |
          cat > release-notes.md <<'EOF'
          Automated Entrox dev build from `${GITHUB_SHA}`.

          ## Install

          ### macOS

          ```bash
          brew tap hexonal/entrox
          brew install entrox
          ```

          For this dev build, download `entrox-cli-macos-arm64.zip`, unzip it, and move `bin/entrox` into a directory on your `PATH`.

          ### Linux

          Download `entrox-cli-linux-x64.zip`, unzip it, and move `bin/entrox` into a directory on your `PATH`.

          ```bash
          unzip entrox-cli-linux-x64.zip
          chmod +x bin/entrox
          sudo mv bin/entrox /usr/local/bin/entrox
          entrox --version
          ```

          ### Windows

          ```powershell
          scoop bucket add entrox https://github.com/hexonal/scoop-entrox
          scoop install entrox
          ```

          For this dev build, download `entrox-cli-windows-x64.zip`, unzip it, and add the extracted `bin` directory to `PATH`.
          EOF
          sed -i "s/\${GITHUB_SHA}/${GITHUB_SHA}/g" release-notes.md
          gh release delete "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$TAG_NAME" release-assets/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "Entrox Dev Build" \
            --notes-file release-notes.md
