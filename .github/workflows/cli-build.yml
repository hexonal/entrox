name: cli-build

on:
  push:
    branches:
      - feature/entrox-whitelabel-login-todo
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENCODE_CHANNEL: ci
  OPENCODE_VERSION: 0.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}

jobs:
  build:
    name: build (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux-x64
            host: ubuntu-24.04
          - name: macos-arm64
            host: macos-26
          - name: windows-x64
            host: windows-2025-vs2026
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          save-cache: "false"

      - name: Build native CLI
        working-directory: packages/opencode
        run: bun run build --single --skip-install --skip-embed-web-ui

      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: entrox-cli-${{ matrix.settings.name }}
          if-no-files-found: error
          retention-days: 7
          path: packages/opencode/dist/entrox-*

  release:
    name: publish dev release
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip release]')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download CLI artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-input

      - name: Package release assets
        run: |
          mkdir -p release-assets
          python3 - <<'PY'
          import pathlib
          import shutil

          root = pathlib.Path("release-input")
          output = pathlib.Path("release-assets")
          for artifact in sorted(root.iterdir()):
              if artifact.is_dir():
                  children = [child for child in artifact.iterdir()]
                  source = children[0] if len(children) == 1 and children[0].is_dir() else artifact
                  shutil.make_archive(str(output / artifact.name), "zip", source)
          PY
          ls -lh release-assets

      - name: Create release manifest
        env:
          ALIYUN_OSS_PUBLIC_BASE_URL: ${{ vars.ALIYUN_OSS_PUBLIC_BASE_URL }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          output = pathlib.Path("release-assets")
          public_base_url = os.environ.get("ALIYUN_OSS_PUBLIC_BASE_URL", "").rstrip("/")
          version = os.environ["OPENCODE_VERSION"]
          public_asset_base_url = f"{public_base_url}/{version}" if public_base_url else ""
          assets = []
          checksum_lines = []
          for path in sorted(output.glob("*.zip")):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              checksum_lines.append(f"{digest}  {path.name}")
              item = {
                  "name": path.name,
                  "sha256": digest,
                  "size": path.stat().st_size,
              }
              if public_asset_base_url:
                  item["url"] = f"{public_asset_base_url}/{path.name}"
              assets.append(item)

          (output / "SHA256SUMS").write_text("\n".join(checksum_lines) + "\n", encoding="utf-8")
          manifest = {
              "version": version,
              "tag": "entrox-dev",
              "commit": os.environ["GITHUB_SHA"],
              "assets": assets,
          }
          if public_asset_base_url:
              manifest["download_base_url"] = public_asset_base_url
          (output / "latest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          ls -lh release-assets

      - name: Upload release assets to Aliyun OSS mirror
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ vars.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ vars.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_PREFIX: ${{ vars.ALIYUN_OSS_PREFIX || 'entrox-dev' }}
          ALIYUN_OSS_OBJECT_ACL: ${{ vars.ALIYUN_OSS_OBJECT_ACL || 'public-read' }}
        run: |
          set -euo pipefail
          if [ -z "${ALIYUN_OSS_ACCESS_KEY_ID:-}" ] || \
             [ -z "${ALIYUN_OSS_ACCESS_KEY_SECRET:-}" ] || \
             [ -z "${ALIYUN_OSS_BUCKET:-}" ] || \
             [ -z "${ALIYUN_OSS_ENDPOINT:-}" ]; then
            echo "Aliyun OSS mirror is not configured; skipping upload."
            exit 0
          fi

          python3 - <<'PY'
          import base64
          import email.utils
          import hashlib
          import hmac
          import mimetypes
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          access_key_id = os.environ["ALIYUN_OSS_ACCESS_KEY_ID"]
          access_key_secret = os.environ["ALIYUN_OSS_ACCESS_KEY_SECRET"]
          bucket = os.environ["ALIYUN_OSS_BUCKET"].strip()
          endpoint = os.environ["ALIYUN_OSS_ENDPOINT"].strip().rstrip("/")
          prefix = os.environ.get("ALIYUN_OSS_PREFIX", "entrox-dev").strip("/")
          object_acl = os.environ.get("ALIYUN_OSS_OBJECT_ACL", "public-read").strip()
          version = os.environ["OPENCODE_VERSION"].strip()

          parsed = urllib.parse.urlparse(endpoint if "://" in endpoint else f"https://{endpoint}")
          scheme = parsed.scheme or "https"
          endpoint_host = parsed.netloc or parsed.path
          host = endpoint_host if endpoint_host.startswith(f"{bucket}.") else f"{bucket}.{endpoint_host}"

          def object_key_for(path: pathlib.Path) -> str:
              if path.name == "latest.json":
                  return f"{prefix}/{path.name}" if prefix else path.name
              return f"{prefix}/{version}/{path.name}" if prefix else f"{version}/{path.name}"

          def put_object(path: pathlib.Path) -> None:
              object_key = object_key_for(path)
              quoted_key = urllib.parse.quote(object_key, safe="/")
              url = f"{scheme}://{host}/{quoted_key}"
              content_type = mimetypes.guess_type(path.name)[0] or "application/octet-stream"
              date = email.utils.formatdate(usegmt=True)
              headers = {
                  "Date": date,
                  "Content-Type": content_type,
                  "x-oss-object-acl": object_acl,
              }
              if path.name == "latest.json":
                  headers["Cache-Control"] = "no-cache, no-store, must-revalidate"
              else:
                  headers["Cache-Control"] = "public, max-age=31536000, immutable"
              canonical_oss_headers = "".join(
                  f"{key.lower()}:{value}\n"
                  for key, value in sorted(headers.items())
                  if key.lower().startswith("x-oss-")
              )
              canonical_resource = f"/{bucket}/{object_key}"
              string_to_sign = f"PUT\n\n{content_type}\n{date}\n{canonical_oss_headers}{canonical_resource}"
              signature = base64.b64encode(
                  hmac.new(access_key_secret.encode(), string_to_sign.encode(), hashlib.sha1).digest()
              ).decode()
              headers["Authorization"] = f"OSS {access_key_id}:{signature}"
              data = path.read_bytes()
              request = urllib.request.Request(url, data=data, headers=headers, method="PUT")
              with urllib.request.urlopen(request, timeout=600) as response:
                  if response.status // 100 != 2:
                      raise RuntimeError(f"upload failed for {path.name}: HTTP {response.status}")
              print(f"uploaded {path.name} -> oss://{bucket}/{object_key}")

          for path in sorted(pathlib.Path("release-assets").iterdir()):
              if path.is_file():
                  put_object(path)
          PY

      - name: Publish dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: entrox-dev
        run: |
          cat > release-notes.md <<'EOF'
          Automated Entrox dev build from `${GITHUB_SHA}`.
          Version: `${OPENCODE_VERSION}`.

          ## Install

          ### macOS / Linux

          ```bash
          curl -fsSL https://entrox.996icu.wiki/install | bash
          ```

          ### Windows

          ```powershell
          irm https://entrox.996icu.wiki/install.ps1 | iex
          ```

          These installers download from `https://entrox.996icu.wiki/downloads/entrox-dev/...`.
          Configure the Sub2API service with `ENTROX_DOWNLOAD_MIRROR_BASE_URL` to redirect those downloads to an Aliyun OSS/CDN mirror.

          ### macOS fallback: Homebrew

          ```bash
          # Self-heals a corrupted local tap before installing.
          ENTROX_HOMEBREW_TAP="$(brew --repository)/Library/Taps/hexonal/homebrew-entrox"; if [ -d "$ENTROX_HOMEBREW_TAP/.git" ]; then (git -C "$ENTROX_HOMEBREW_TAP" fetch origin && git -C "$ENTROX_HOMEBREW_TAP" reset --hard origin/main && git -C "$ENTROX_HOMEBREW_TAP" clean -fd) || rm -rf "$ENTROX_HOMEBREW_TAP"; elif [ -d "$ENTROX_HOMEBREW_TAP" ]; then rm -rf "$ENTROX_HOMEBREW_TAP"; fi; HOMEBREW_NO_AUTO_UPDATE=1 brew tap hexonal/entrox; (HOMEBREW_NO_AUTO_UPDATE=1 brew trust hexonal/entrox || true); HOMEBREW_NO_AUTO_UPDATE=1 brew upgrade hexonal/entrox/entrox || HOMEBREW_NO_AUTO_UPDATE=1 brew install hexonal/entrox/entrox
          ```

          For this dev build, download `entrox-cli-macos-arm64.zip`, unzip it, and move `bin/entrox` into a directory on your `PATH`.

          ### Linux fallback: manual

          Download `entrox-cli-linux-x64.zip`, unzip it, and move `bin/entrox` into a directory on your `PATH`.

          ```bash
          unzip entrox-cli-linux-x64.zip
          chmod +x bin/entrox
          sudo mv bin/entrox /usr/local/bin/entrox
          entrox --version
          ```

          ### Windows fallback: Scoop

          ```powershell
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          scoop bucket add entrox https://github.com/hexonal/scoop-entrox
          scoop install entrox
          ```

          For this dev build, download `entrox-cli-windows-x64.zip`, unzip it, and add the extracted `bin` directory to `PATH`.
          EOF
          sed -i "s/\${GITHUB_SHA}/${GITHUB_SHA}/g" release-notes.md
          sed -i "s/\${OPENCODE_VERSION}/${OPENCODE_VERSION}/g" release-notes.md
          gh release delete "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$TAG_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "Entrox Dev Build" \
            --notes-file release-notes.md

      - name: Trigger package index sync
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PACKAGE_SYNC_TOKEN secret is required to sync Homebrew and Scoop indexes."
            exit 1
          fi

          dispatch() {
            local repo="$1"
            local event_type="$2"
            curl -fsS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${repo}/dispatches" \
              -d "{\"event_type\":\"${event_type}\",\"client_payload\":{\"source_repository\":\"${GITHUB_REPOSITORY}\",\"source_sha\":\"${GITHUB_SHA}\",\"version\":\"${OPENCODE_VERSION}\"}}"
          }

          dispatch "hexonal/homebrew-entrox" "sync-dev-formula"
          dispatch "hexonal/scoop-entrox" "sync-dev-manifest"
